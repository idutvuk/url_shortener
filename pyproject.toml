[project]
name = "url_shortener"
version = "0.1.0"
description = "Dead simple url shortener for me"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "dotenv>=0.9.9",
    "fastapi>=0.115.9",
    "loguru>=0.7.3",
    "sqlmodel>=0.0.27",
    "uvicorn>=0.34.0",
]

[dependency-groups]
dev = [
    "ruff>=0.14.8",
]


[tool.ruff.lint]
select = [
    # copypasted this from astralsh
    "E", # pycodestyle
    "F", # Pyflakes
    "UP", # pyupgrade
    "B", # flake8-bugbear
    "SIM", # flake8-simplify
    "I", # isort
]
ignore = ["B008"]